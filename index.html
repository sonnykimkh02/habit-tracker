<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0d0c0a;
  --bg2:    #181714;
  --bg3:    #222019;
  --bg4:    #2a2824;
  --border: rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --border3:rgba(255,255,255,0.20);
  --text:   #ede9e2;
  --text2:  rgba(237,233,226,0.5);
  --text3:  rgba(237,233,226,0.28);
  --c0: #5b8dd9;
  --c1: #3dba8f;
  --c2: #e09a30;
  --c3: #d96b8c;
  --r: 12px;
  --rs: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-weight:400;
  min-height:100vh;
  line-height:1.5;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 45% at 85% 10%, rgba(91,141,217,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 55% 55% at 5%  85%, rgba(61,186,143,0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(217,107,140,0.025) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.page{
  position:relative;z-index:1;
  max-width:1060px;
  margin:0 auto;
  padding:44px 24px 88px;
}

/* ─── Header ─── */
.header{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:40px;gap:16px;
  border-bottom:1px solid var(--border);
  padding-bottom:28px;
}
.header h1{
  font-family:'Instrument Serif',serif;
  font-size:46px;font-weight:400;
  letter-spacing:-0.025em;line-height:1;
  color:var(--text);
}
.header h1 em{font-style:italic;color:var(--text2)}
.header-date{
  font-size:12px;color:var(--text3);
  margin-top:8px;letter-spacing:0.08em;text-transform:uppercase;
}
.header-streak{
  font-size:13px;color:var(--text2);
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:20px;padding:6px 14px;
  white-space:nowrap;flex-shrink:0;
}

/* ─── Section label ─── */
.sec{
  font-size:10px;font-weight:500;
  color:var(--text3);letter-spacing:0.12em;
  text-transform:uppercase;
  margin-bottom:12px;
}

/* ─── Today habits ─── */
.today-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:14px;
}
.habit-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;
  transition:border-color .18s, background .18s, transform .08s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.habit-card::after{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--hc);
  opacity:0;transition:opacity .2s;
  border-radius:3px 0 0 3px;
}
.habit-card.done::after{opacity:1}
.habit-card:hover{border-color:var(--border2);background:var(--bg3)}
.habit-card:active{transform:scale(0.997)}
.habit-card.done{border-color:var(--hc);background:var(--bg3)}
.h-icon{
  font-size:18px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:9px;flex-shrink:0;
  transition:border-color .18s;
}
.habit-card.done .h-icon{border-color:var(--hc)}
.h-info{flex:1;min-width:0}
.h-name{
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.h-sub{font-size:11px;color:var(--text3);margin-top:2px}
.h-check{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .18s;
}
.habit-card.done .h-check{background:var(--hc);border-color:var(--hc)}
.ck{display:none}
.habit-card.done .ck{display:block}

/* ─── Legend ─── */
.legend{
  display:flex;flex-wrap:wrap;gap:12px;
  margin-bottom:28px;
}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ─── Two-col layout for week + month ─── */
.calendars{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
  align-items:start;
}
.cal-block{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px;
}
.cal-block-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;gap:10px;
  flex-wrap:wrap;
}
.cal-block-title{
  font-size:13px;font-weight:500;color:var(--text);
}
.pct-badge{
  font-size:11px;font-weight:500;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:3px 10px;
  color:var(--text2);white-space:nowrap;
}
.pct-badge b{color:var(--text);font-weight:600}

/* week grid */
.wg-heads,.wg-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wg-heads{margin-bottom:4px}
.wg-head{text-align:center;font-size:10px;color:var(--text3);letter-spacing:0.05em;padding:2px 0}
.wg-cell{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:7px;padding:7px 4px 6px;min-height:58px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:border-color .15s;
}
.wg-cell.today{border-color:rgba(237,233,226,0.28);background:var(--bg4)}
.wg-date{font-size:11px;color:var(--text2);font-weight:500}
.wg-cell.today .wg-date{color:var(--text)}
.wg-dots{display:flex;flex-direction:column;gap:3px;align-items:center}
.dot-r{display:flex;gap:3px}
.wd{width:7px;height:7px;border-radius:50%}
.wd.miss{background:var(--text);opacity:0.1}

/* month grid */
.mg-nav{display:flex;align-items:center;gap:8px}
.mg-nav-btn{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:6px;color:var(--text2);
  font-size:13px;width:24px;height:24px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.mg-nav-btn:hover{border-color:var(--border2);color:var(--text)}
.mg-title{font-size:13px;font-weight:500;color:var(--text)}
.mg-heads,.mg-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mg-heads{margin-bottom:3px}
.mg-head{text-align:center;font-size:10px;color:var(--text3);padding:2px 0;letter-spacing:0.04em}
.mg-cell{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:5px;padding:4px 3px 3px;min-height:34px;
}
.mg-cell.empty{background:transparent;border-color:transparent}
.mg-cell.today-c{border-color:rgba(237,233,226,0.22);background:var(--bg4)}
.mg-date{font-size:9px;color:var(--text3);text-align:right;margin-bottom:3px}
.mg-cell.today-c .mg-date{color:var(--text2)}
.mbars{display:flex;flex-direction:column;gap:2px}
.mbar{height:2px;border-radius:1px}

/* ─── Progress section ─── */
.progress-section{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}
.prog-block{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px;
}
.prog-block-header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:16px;
}
.prog-block-title{font-size:13px;font-weight:500;color:var(--text)}
.prog-total-pct{
  font-family:'Instrument Serif',serif;
  font-size:24px;font-weight:400;color:var(--text);line-height:1;
}
.prog-item{
  display:grid;
  grid-template-columns:26px 1fr 40px;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.prog-item:last-child{margin-bottom:0}
.prog-icon{font-size:16px;text-align:center}
.prog-track{
  height:5px;background:var(--bg4);
  border-radius:3px;overflow:hidden;
  border:1px solid var(--border);
}
.prog-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-count{font-size:11px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}

/* ─── Time Progress ─── */
.time-section{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:22px 24px;
}
.time-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.time-title{font-size:13px;font-weight:500;color:var(--text)}
.time-clock{
  font-size:11px;color:var(--text3);
  font-variant-numeric:tabular-nums;
  letter-spacing:0.04em;
}
.time-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
}
.time-item{
  display:flex;flex-direction:column;align-items:center;
  padding:0 12px;
  border-right:1px solid var(--border);
}
.time-item:last-child{border-right:none}
.time-label{
  font-size:10px;color:var(--text3);
  letter-spacing:0.1em;text-transform:uppercase;
  margin-bottom:14px;font-weight:500;
}
.time-ring-wrap{
  position:relative;
  width:80px;height:80px;
  margin-bottom:12px;
}
.time-ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg4);stroke-width:5}
.ring-fill{
  fill:none;stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1);
}
.ring-txt{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-num{
  font-family:'Instrument Serif',serif;
  font-size:20px;font-weight:400;color:var(--text);line-height:1;
}
.ring-pct-sym{font-size:10px;color:var(--text3);margin-top:1px}
.time-detail{
  font-size:10px;color:var(--text3);text-align:center;line-height:1.6;
}

/* ─── Responsive ─── */
@media(max-width:720px){
  .calendars,.progress-section{grid-template-columns:1fr}
  .time-grid{grid-template-columns:repeat(2,1fr)}
  .time-item{border-right:none;border-bottom:1px solid var(--border);padding:16px 0}
  .time-item:nth-child(odd){border-right:1px solid var(--border)}
  .time-item:last-child,.time-item:nth-last-child(2){border-bottom:none}
  .today-grid{grid-template-columns:1fr}
  .header h1{font-size:34px}
}
@media(max-width:480px){
  .page{padding:24px 14px 60px}
  .time-ring-wrap{width:64px;height:64px}
  .ring-num{font-size:17px}
}

/* ─── Animations ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page>*{animation:fadeUp .38s ease both}
.header{animation-delay:.00s}
.sec,.today-grid{animation-delay:.05s}
.legend{animation-delay:.08s}
.calendars{animation-delay:.11s}
.progress-section{animation-delay:.15s}
.time-section{animation-delay:.19s}

/* ─── Curriculum Section ─── */
.curriculum-section{
  margin-top:16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
}
.curriculum-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
}
.curriculum-header:hover{background:var(--bg3)}
.curriculum-title-row{display:flex;align-items:center;gap:12px}
.curriculum-title{
  font-family:'Instrument Serif',serif;
  font-size:20px;font-weight:400;color:var(--text);
}
.curriculum-overall{
  font-size:11px;color:var(--text3);
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:3px 10px;
  white-space:nowrap;
}
.curriculum-overall b{color:var(--text);font-weight:600}
.curriculum-toggle{
  font-size:12px;color:var(--text3);
  display:flex;align-items:center;gap:6px;
  transition:transform .25s;
}
.curriculum-toggle.open{transform:rotate(180deg)}
.curriculum-body{display:none}
.curriculum-body.open{display:block}
.curriculum-progress-bar{
  height:3px;background:var(--bg4);
  margin:0 24px 0;
}
.curriculum-progress-fill{
  height:3px;background:linear-gradient(90deg,#5b8dd9,#3dba8f);
  border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1);
}
.chapter-block{
  border-bottom:1px solid var(--border);
}
.chapter-block:last-child{border-bottom:none}
.chapter-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px 12px;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.chapter-header:hover{background:var(--bg3)}
.chapter-title{font-size:13px;font-weight:500;color:var(--text)}
.chapter-meta{display:flex;align-items:center;gap:10px}
.chapter-count{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.chapter-mini-bar{
  width:60px;height:4px;background:var(--bg4);
  border-radius:2px;overflow:hidden;
}
.chapter-mini-fill{height:100%;border-radius:2px;background:#5b8dd9;transition:width .4s}
.chapter-chevron{
  font-size:10px;color:var(--text3);margin-left:6px;
  transition:transform .2s;display:inline-block;
}
.chapter-header.open .chapter-chevron{transform:rotate(180deg)}
.items-list{
  display:none;
  padding:4px 24px 12px 40px;
  display:none;
}
.items-list.open{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;}
.item-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 0;
  cursor:pointer;user-select:none;
  border-radius:6px;
  transition:background .12s;
}
.item-row:hover{background:var(--bg3)}
.item-cb{
  width:15px;height:15px;border-radius:4px;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;background:transparent;
}
.item-row.checked .item-cb{
  background:#5b8dd9;border-color:#5b8dd9;
}
.item-num{font-size:11px;color:var(--text3);min-width:28px;font-variant-numeric:tabular-nums}
.item-name{font-size:12px;color:var(--text2);line-height:1.4}
.item-row.checked .item-name{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--border2)}
@media(max-width:600px){
  .items-list.open{grid-template-columns:1fr}
  .chapter-header{padding:12px 16px}
  .curriculum-header{padding:16px 18px 14px}
  .items-list{padding-left:16px;padding-right:16px}
}

/* ─── Kelly Section ─── */
.kelly-section{
  margin-top:16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
}
.kelly-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;
}
.kelly-header:hover{background:var(--bg3)}
.kelly-title-row{display:flex;align-items:center;gap:12px}
.kelly-title{
  font-family:'Instrument Serif',serif;
  font-size:20px;font-weight:400;color:var(--text);
}
.kelly-overall{
  font-size:11px;color:var(--text3);
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:3px 10px;white-space:nowrap;
}
.kelly-overall b{color:var(--text);font-weight:600}
.kelly-toggle{font-size:12px;color:var(--text3)}
.kelly-body{display:none}
.kelly-body.open{display:block}
.kelly-prog-wrap{padding:12px 24px 0}
.kelly-prog-bar{height:3px;background:var(--bg4);border-radius:2px;margin-bottom:16px}
.kelly-prog-fill{height:3px;background:linear-gradient(90deg,#3dba8f,#9b7fe8);border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.kelly-group{border-bottom:1px solid var(--border)}
.kelly-group:last-child{border-bottom:none}
.kelly-group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 24px 11px;cursor:pointer;user-select:none;transition:background .15s;
}
.kelly-group-header:hover{background:var(--bg3)}
.kelly-group-title{font-size:13px;font-weight:500;color:var(--text)}
.kelly-group-meta{display:flex;align-items:center;gap:10px}
.kelly-group-count{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.kelly-mini-bar{width:60px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.kelly-mini-fill{height:100%;border-radius:2px;background:#3dba8f;transition:width .4s}
.kelly-chevron{font-size:10px;color:var(--text3);margin-left:6px;transition:transform .2s;display:inline-block}
.kelly-group-header.open .kelly-chevron{transform:rotate(180deg)}
.kelly-items{display:none;padding:4px 24px 14px 40px}
.kelly-items.open{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px}
.kelly-item{
  display:flex;align-items:center;gap:8px;
  padding:5px 4px;cursor:pointer;user-select:none;
  border-radius:6px;transition:background .12s;
}
.kelly-item:hover{background:var(--bg3)}
.kelly-item-cb{
  width:15px;height:15px;border-radius:4px;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.kelly-item.checked .kelly-item-cb{background:#3dba8f;border-color:#3dba8f}
.kelly-item-num{font-size:11px;color:var(--text3);min-width:28px;font-variant-numeric:tabular-nums}
.kelly-item-name{font-size:12px;color:var(--text2);line-height:1.4}
.kelly-item.checked .kelly-item-name{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--border2)}
@media(max-width:600px){
  .kelly-items.open{grid-template-columns:1fr}
  .kelly-group-header{padding:12px 16px}
  .kelly-header{padding:16px 18px 14px}
  .kelly-items{padding-left:16px;padding-right:16px}
}

/* ─── BBC Section ─── */
.bbc-section{
  margin-top:16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  transition:border-color .18s, background .18s;
}
.bbc-section:hover{border-color:var(--border2);background:var(--bg3)}
.bbc-left{display:flex;align-items:center;gap:14px}
.bbc-icon{
  font-size:22px;width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;flex-shrink:0;
}
.bbc-text{}
.bbc-title{
  font-family:'Instrument Serif',serif;
  font-size:20px;font-weight:400;color:var(--text);line-height:1.2;
}
.bbc-subtitle{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:0.02em}
.bbc-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;color:var(--text2);
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:6px 14px;
  text-decoration:none;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.bbc-link:hover{color:var(--text);border-color:var(--border3)}
.bbc-link svg{flex-shrink:0}

/* ─── Loading overlay ─── */
#loading-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;gap:16px;
}
.loading-spinner{
  width:32px;height:32px;
  border:2px solid var(--border2);
  border-top-color:var(--text2);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYG6_IhbnJoxrVA7NeCECyLaxZDp7GgS8",
  authDomain: "englishhabittracker.firebaseapp.com",
  projectId: "englishhabittracker",
  storageBucket: "englishhabittracker.firebasestorage.app",
  messagingSenderId: "217511841704",
  appId: "1:217511841704:web:5f34361e030912a9cf579d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ─── Firestore helpers ─── */
const USER_ID = 'user_default'; // 단일 사용자 고정 ID

async function fsGet(docId) {
  try {
    const snap = await getDoc(doc(db, 'habitData', docId));
    return snap.exists() ? snap.data().payload : {};
  } catch(e) { console.warn('fsGet error', e); return {}; }
}

async function fsSet(docId, payload) {
  try {
    await setDoc(doc(db, 'habitData', docId), { payload }, { merge: false });
  } catch(e) { console.warn('fsSet error', e); }
}

/* ─── Loading overlay ─── */
function showLoading(v) {
  document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none';
}

const HABITS=[
  {id:0,icon:'📕',name:'소피반 생존회화 ChatGPT 상황극',short:'소피반 ChatGPT',color:'#5b8dd9'},
  {id:1,icon:'😆',name:'소피반 생존회화 제미나이 상황극',short:'소피반 제미나이',color:'#3dba8f'},
  {id:2,icon:'🇺🇸',name:'소피반 생존회화 책 공부',short:'소피반 책 공부',color:'#e09a30'},
  {id:3,icon:'📺',name:'The Bear 보기',short:'The Bear',color:'#d96b8c'},
  {id:4,icon:'🇬🇧',name:'BBC 뉴스 보기',short:'BBC 뉴스',color:'#9b7fe8'},
  {id:5,icon:'✍️',name:'하루키책 필사',short:'하루키 필사',color:'#c17f3e',weekdaysOnly:true},
];
const DK=['일','월','화','수','목','금','토'];
const WH=['월','화','수','목','금','토','일'];
let data={}, curMonth=new Date();
let _saving=false;

async function loadHabitData(){
  data = await fsGet('habits_'+USER_ID);
}

async function saveHabitData(){
  await fsSet('habits_'+USER_ID, data);
}

const now=()=>new Date();
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const tkey=()=>dkey(now());
const isDone=(hid,k)=>!!(data[k]&&data[k][hid]);
const isWeekday=(d)=>{ const day=d.getDay(); return day>=1&&day<=5; };
const isActiveForDate=(h,d)=>h.weekdaysOnly ? isWeekday(d) : true;

function toggle(hid){
  const k=tkey();
  if(!data[k])data[k]={};
  data[k][hid]=!data[k][hid];
  saveHabitData();
  render();
}

function weekDates(){
  const n=now(),mon=new Date(n);
  mon.setDate(n.getDate()-((n.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

function monthDates(ref){
  const y=ref.getFullYear(),m=ref.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const pad=(first.getDay()+6)%7,days=[];
  for(let i=0;i<pad;i++)days.push(null);
  for(let d=1;d<=last.getDate();d++)days.push(new Date(y,m,d));
  return days;
}

function streak(hid){
  let s=0;const d=new Date(now());
  while(isDone(hid,dkey(d))){s++;d.setDate(d.getDate()-1);}
  return s;
}

function timeProgress(){
  const n=now();
  const h=n.getHours(),mi=n.getMinutes(),sec=n.getSeconds();
  const y=n.getFullYear(),mo=n.getMonth(),dy=n.getDate();
  const dailySec=h*3600+mi*60+sec;
  const wday=(n.getDay()+6)%7;
  const weekSec=wday*86400+dailySec;
  const dim=new Date(y,mo+1,0).getDate();
  const monthSec=(dy-1)*86400+dailySec;
  const startY=new Date(y,0,1);
  const endY=new Date(y+1,0,1);
  const yearPct=Math.round((n-startY)/(endY-startY)*100);
  const pad2=v=>String(v).padStart(2,'0');
  return [
    {label:'Daily',  pct:Math.round(dailySec/864), color:'#5b8dd9',
     line1:`${pad2(h)}:${pad2(mi)} / 24:00`, line2:`${Math.round(dailySec/3600*10)/10}시간 경과`},
    {label:'Weekly', pct:Math.round(weekSec/6048), color:'#3dba8f',
     line1:`${['월','화','수','목','금','토','일'][wday]}요일`, line2:`${wday+1}/7일차`},
    {label:'Monthly',pct:Math.round(monthSec/(dim*864)), color:'#e09a30',
     line1:`${dy}일 / ${dim}일`, line2:`${dim-dy}일 남음`},
    {label:'Yearly', pct:yearPct, color:'#d96b8c',
     line1:`${mo+1}월 ${dy}일`, line2:`${Math.round((endY-n)/86400000)}일 남음`},
  ];
}

function ring(pct,color,size=80,sw=5){
  const r=(size-sw*2)/2;
  const circ=2*Math.PI*r;
  const offset=circ*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
    <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}"
      stroke="${color}" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
  </svg>`;
}

function renderHeader(){
  const n=now();
  document.getElementById('today-label').textContent=
    `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${DK[n.getDay()]}요일`;
  const maxS=Math.max(...HABITS.map(h=>streak(h.id)));
  const todayD=now();
  const activeToday=HABITS.filter(h=>isActiveForDate(h,todayD));
  const dc=activeToday.filter(h=>isDone(h.id,tkey())).length;
  document.getElementById('header-streak').textContent=
    `오늘 ${dc}/${activeToday.length} 완료  ·  🔥 최고 ${maxS}일 연속`;
}

function renderLegend(){
  document.getElementById('legend').innerHTML=HABITS.map(h=>
    `<div class="leg-item"><div class="leg-dot" style="background:${h.color}"></div>${h.icon} ${h.short}</div>`
  ).join('');
}

function renderToday(){
  const tk=tkey();
  const todayD=now();
  document.getElementById('today-grid').innerHTML=HABITS.map(h=>{
    const active=isActiveForDate(h,todayD);
    const d=isDone(h.id,tk),s=streak(h.id);
    if(!active){
      return `<div class="habit-card" style="--hc:${h.color};opacity:0.35;cursor:default;">
        <div class="h-icon">${h.icon}</div>
        <div class="h-info">
          <div class="h-name">${h.name}</div>
          <div class="h-sub">주말 휴무 📅 월~금만</div>
        </div>
        <div class="h-check" style="opacity:0.3"></div>
      </div>`;
    }
    return `<div class="habit-card ${d?'done':''}" style="--hc:${h.color}" onclick="toggle(${h.id})">
      <div class="h-icon">${h.icon}</div>
      <div class="h-info">
        <div class="h-name">${h.name}</div>
        <div class="h-sub">${s>0?`🔥 ${s}일 연속`:'시작해볼까요!'}</div>
      </div>
      <div class="h-check">
        <svg class="ck" width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M1.5 5.5l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;
  }).join('');
}

function renderWeekGrid(){
  const wd=weekDates(),tk=tkey();
  document.getElementById('wg-heads').innerHTML=WH.map(h=>`<div class="wg-head">${h}</div>`).join('');
  document.getElementById('wg-cells').innerHTML=wd.map(d=>{
    const k=dkey(d),isT=k===tk;
    const cellDate=d;
    const r0=HABITS.slice(0,3).map(h=>`<div class="wd ${isDone(h.id,k)?'':'miss'}" style="background:${isDone(h.id,k)?h.color:''}"></div>`).join('');
    const r1=HABITS.slice(3,5).map(h=>`<div class="wd ${isDone(h.id,k)?'':'miss'}" style="background:${isDone(h.id,k)?h.color:''}"></div>`).join('');
    const h5=HABITS[5];
    const r2=isActiveForDate(h5,cellDate)
      ? `<div class="wd ${isDone(h5.id,k)?'':'miss'}" style="background:${isDone(h5.id,k)?h5.color:''}"></div>`
      : `<div class="wd" style="background:rgba(255,255,255,0.04);"></div>`;
    return `<div class="wg-cell ${isT?'today':''}">
      <div class="wg-date">${d.getDate()}</div>
      <div class="wg-dots"><div class="dot-r">${r0}</div><div class="dot-r">${r1}</div><div class="dot-r">${r2}</div></div>
    </div>`;
  }).join('');
  const totalDone=wd.reduce((a,d)=>a+HABITS.filter(h=>isActiveForDate(h,d)&&isDone(h.id,dkey(d))).length,0);
  const totalPossible=wd.reduce((a,d)=>a+HABITS.filter(h=>isActiveForDate(h,d)).length,0);
  document.getElementById('week-pct-badge').textContent=Math.round(totalDone/totalPossible*100)+'%';
}

function renderMonthGrid(){
  const days=monthDates(curMonth),tk=tkey();
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  document.getElementById('mg-title').textContent=`${y}년 ${m+1}월`;
  document.getElementById('mg-heads').innerHTML=WH.map(h=>`<div class="mg-head">${h}</div>`).join('');
  document.getElementById('mg-cells').innerHTML=days.map(d=>{
    if(!d)return`<div class="mg-cell empty"></div>`;
    const k=dkey(d),isT=k===tk;
    const dateObj=d;
    const bars=HABITS.map(h=>{
      if(!isActiveForDate(h,dateObj)) return `<div class="mbar" style="background:rgba(255,255,255,0.03)"></div>`;
      return `<div class="mbar" style="background:${isDone(h.id,k)?h.color:'rgba(255,255,255,0.07)'}"></div>`;
    }).join('');
    return `<div class="mg-cell ${isT?'today-c':''}">
      <div class="mg-date">${d.getDate()}</div>
      <div class="mbars">${bars}</div>
    </div>`;
  }).join('');
  const dim=new Date(y,m+1,0).getDate();
  let totalDoneM=0, totalPossM=0;
  for(let dd=1;dd<=dim;dd++){
    const date=new Date(y,m,dd);
    HABITS.forEach(h=>{
      if(!isActiveForDate(h,date)) return;
      totalPossM++;
      if(isDone(h.id,dkey(date))) totalDoneM++;
    });
  }
  document.getElementById('month-pct-badge').textContent=Math.round(totalDoneM/totalPossM*100)+'%';
}

function renderWeekProgress(){
  const wd=weekDates();
  let grand=0;
  const html=HABITS.map(h=>{
    const activeDays=wd.filter(dd=>isActiveForDate(h,dd));
    const d=activeDays.filter(dd=>isDone(h.id,dkey(dd))).length;
    const total=activeDays.length;
    const pct=total>0?Math.round(d/total*100):0;
    grand+=pct;
    const tag=h.weekdaysOnly?`<span style="font-size:10px;color:var(--text3);margin-left:4px;">월~금</span>`:'';
    return `<div class="prog-item">
      <div class="prog-icon">${h.icon}</div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${h.color}"></div></div>
      <div class="prog-count">${d}/${total}${h.weekdaysOnly?'<span style="font-size:9px;color:var(--text3)"> 주중</span>':''}</div>
    </div>`;
  }).join('');
  document.getElementById('week-progress').innerHTML=html;
  document.getElementById('week-total-pct').textContent=Math.round(grand/HABITS.length)+'%';
}

function renderMonthProgress(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  let grand=0;
  const html=HABITS.map(h=>{
    let d=0, total=0;
    for(let dd=1;dd<=dim;dd++){
      const date=new Date(y,m,dd);
      if(!isActiveForDate(h,date)) continue;
      total++;
      if(isDone(h.id,dkey(date))) d++;
    }
    const pct=total>0?Math.round(d/total*100):0;
    grand+=pct;
    return `<div class="prog-item">
      <div class="prog-icon">${h.icon}</div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${h.color}"></div></div>
      <div class="prog-count">${d}/${total}${h.weekdaysOnly?'<span style="font-size:9px;color:var(--text3)"> 주중</span>':''}</div>
    </div>`;
  }).join('');
  document.getElementById('month-progress').innerHTML=html;
  document.getElementById('month-total-pct').textContent=Math.round(grand/HABITS.length)+'%';
}

function renderTimeProgress(){
  const tp=timeProgress();
  const n=now();
  const pad2=v=>String(v).padStart(2,'0');
  document.getElementById('time-clock').textContent=
    `${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())} 기준`;
  document.getElementById('time-grid').innerHTML=tp.map(t=>
    `<div class="time-item">
      <div class="time-label">${t.label}</div>
      <div class="time-ring-wrap">
        ${ring(t.pct,t.color)}
        <div class="ring-txt">
          <div class="ring-num">${t.pct}</div>
          <div class="ring-pct-sym">%</div>
        </div>
      </div>
      <div class="time-detail">${t.line1}<br>${t.line2}</div>
    </div>`
  ).join('');
}

function changeMonth(delta){
  curMonth=new Date(curMonth.getFullYear(),curMonth.getMonth()+delta,1);
  renderMonthGrid();renderMonthProgress();
}

function render(){
  renderHeader();renderLegend();renderToday();
  renderWeekGrid();renderMonthGrid();
  renderWeekProgress();renderMonthProgress();
  renderTimeProgress();
}

function kellyItemKey(n){return 'ep_'+n;}

function kellyToggleItem(n){
  const k=kellyItemKey(n);
  kellyData[k]=!kellyData[k];
  saveKellyData();
  renderKelly();
}

function toggleKelly(){
  const body=document.getElementById('kelly-body');
  const tog=document.getElementById('kelly-toggle');
  body.classList.toggle('open');
  tog.textContent=body.classList.contains('open')?'▲':'▼';
}

function toggleKellyGroup(gi){
  document.getElementById('kelly-items-'+gi).classList.toggle('open');
  document.getElementById('kelly-ghd-'+gi).classList.toggle('open');
}

function renderKelly(){
  const allItems=KELLY_GROUPS.flatMap(g=>g.items);
  const total=allItems.length;
  const done=allItems.filter(it=>kellyData[kellyItemKey(it.n)]).length;
  document.getElementById('kelly-done').textContent=done;
  document.getElementById('kelly-total').textContent=total;
  document.getElementById('kelly-prog-fill').style.width=(total>0?Math.round(done/total*100):0)+'%';

  document.getElementById('kelly-groups').innerHTML=KELLY_GROUPS.map((g,gi)=>{
    const gDone=g.items.filter(it=>kellyData[kellyItemKey(it.n)]).length;
    const gPct=Math.round(gDone/g.items.length*100);
    const itemsHtml=g.items.map(it=>{
      const checked=!!kellyData[kellyItemKey(it.n)];
      return `<div class="kelly-item ${checked?'checked':''}" onclick="kellyToggleItem('${it.n}')">
        <div class="kelly-item-cb">
          ${checked?`<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 4.5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
        </div>
        <span class="kelly-item-num">${it.n}편</span>
        <span class="kelly-item-name">${it.t}</span>
      </div>`;
    }).join('');
    return `<div class="kelly-group">
      <div class="kelly-group-header" id="kelly-ghd-${gi}" onclick="toggleKellyGroup(${gi})">
        <div class="kelly-group-title">${g.title}</div>
        <div class="kelly-group-meta">
          <span class="kelly-group-count">${gDone}/${g.items.length}</span>
          <div class="kelly-mini-bar"><div class="kelly-mini-fill" style="width:${gPct}%"></div></div>
          <span class="kelly-chevron">▼</span>
        </div>
      </div>
      <div class="kelly-items" id="kelly-items-${gi}">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function currItemKey(n){return 'item_'+n;}

function currToggleItem(n){
  const k=currItemKey(n);
  currData[k]=!currData[k];
  saveCurrData();
  renderCurriculum();
}

function toggleCurriculum(){
  const body=document.getElementById('curr-body');
  const tog=document.getElementById('curr-toggle');
  body.classList.toggle('open');
  tog.textContent=body.classList.contains('open')?'▲':'▼';
}

function toggleChapter(ci){
  const el=document.getElementById('chapter-items-'+ci);
  const hd=document.getElementById('chapter-hd-'+ci);
  el.classList.toggle('open');
  hd.classList.toggle('open');
}

function renderCurriculum(){
  const allItems=CHAPTERS.flatMap(c=>c.items);
  const totalItems=allItems.length;
  const doneItems=allItems.filter(it=>currData[currItemKey(it.n)]).length;
  document.getElementById('curr-done').textContent=doneItems;
  document.getElementById('curr-total').textContent=totalItems;
  const fillPct=totalItems>0?Math.round(doneItems/totalItems*100):0;
  document.getElementById('curr-prog-fill').style.width=fillPct+'%';

  document.getElementById('curr-chapters').innerHTML=CHAPTERS.map((ch,ci)=>{
    const chDone=ch.items.filter(it=>currData[currItemKey(it.n)]).length;
    const chPct=Math.round(chDone/ch.items.length*100);
    const itemsHtml=ch.items.map(it=>{
      const isDoneItem=!!currData[currItemKey(it.n)];
      return `<div class="item-row ${isDoneItem?'checked':''}" onclick="currToggleItem('${it.n}')">
        <div class="item-cb">
          ${isDoneItem?`<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 4.5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
        </div>
        <span class="item-num">${it.n}</span>
        <span class="item-name">${it.t}</span>
      </div>`;
    }).join('');
    return `<div class="chapter-block">
      <div class="chapter-header" id="chapter-hd-${ci}" onclick="toggleChapter(${ci})">
        <div class="chapter-title">${ch.title}</div>
        <div class="chapter-meta">
          <span class="chapter-count">${chDone}/${ch.items.length}</span>
          <div class="chapter-mini-bar"><div class="chapter-mini-fill" style="width:${chPct}%"></div></div>
          <span class="chapter-chevron">▼</span>
        </div>
      </div>
      <div class="items-list" id="chapter-items-${ci}">${itemsHtml}</div>
    </div>`;
  }).join('');
}

/* ─── Expose functions to global scope (needed for inline onclick with ES module) ─── */
window.toggle = toggle;
window.toggleCurriculum = toggleCurriculum;
window.toggleChapter = toggleChapter;
window.currToggleItem = currToggleItem;
window.toggleKelly = toggleKelly;
window.toggleKellyGroup = toggleKellyGroup;
window.kellyToggleItem = kellyToggleItem;
window.changeMonth = changeMonth;

async function init(){
  showLoading(true);
  await Promise.all([loadHabitData(), loadKellyData(), loadCurrData()]);
  showLoading(false);
  render();
  renderCurriculum();
  renderKelly();
}

init();
